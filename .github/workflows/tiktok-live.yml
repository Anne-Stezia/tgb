name: TikTok Live Watcher

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiktok-live-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    environment: my
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check TikTok
        env:
          TG_KEY: ${{ secrets.TG_KEY }}
          TT_ID: ${{ secrets.TT_ID }}
          TT_CHANNEL: ${{ secrets.TT_CHANNEL }}
        run: python main.py

      - name: Save state
        run: |
          if [ ! -f last_room_id.txt ]; then
            echo "No state change"
            exit 0
          fi

          git add last_room_id.txt

          if git diff --cached --quiet; then
            echo "State unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update TikTok live state"
          git push
